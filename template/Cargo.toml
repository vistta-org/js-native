[package]
name = "vistta-js-example"
version = "0.1.0"
description = "Vistta.js Example"
authors = ["unkown"]
edition = "2021"

[lib]
name = "vistta_js_example"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# vistta:plugins:begin
tauri = { version = "2", features = ["devtools"] }
# vistta:plugins:end
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# vistta:plugins-mobile:begin
# vistta:plugins-mobile:end

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# vistta:plugins-desktop:begin
# vistta:plugins-desktop:end